name: Publicar Cercora
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "github-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Aplicar estilos responsive de móvil
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          link = '<link rel="stylesheet" href="./mobile.css">'
          if link not in html:
              if html.count("</head>") != 1:
                  raise SystemExit("No se encontró un cierre único de head")
              page.write_text(html.replace("</head>", link + "</head>", 1), encoding="utf-8")
          PY
      - name: Aplicar respuestas, límites y compartir invitación
        run: python deploy-enhancements.py
      - name: Probar el flujo de los seis modos
        run: |
          mkdir -p /tmp/entredos-smoke
          npm install --prefix /tmp/entredos-smoke --no-save --no-audit --no-fund jsdom@26
          NODE_PATH=/tmp/entredos-smoke/node_modules node tests/smoke-entredos.cjs
      - name: Preparar archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
